CONFIG_SSD1306=n

# DIAGNOSTIC: forces the simplest possible built-in status screen (just a
# battery percentage, no split/BLE-dependent widgets) when nice_view_custom
# isn't also in the shield list. nice_view_custom.conf sets the CUSTOM
# choice member later in the merge and wins for the real build.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n
