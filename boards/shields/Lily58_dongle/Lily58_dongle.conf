# Pure USB dongle: no BLE anywhere, peripherals reach this board over ESB only.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_USB=y

# 2 physical halves talk to this dongle
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# battery level of both halves, proxied over ESB
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# only one radio protocol (ESB) is active on this board, no BLE timeslot sharing needed
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=58

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1
CONFIG_INPUT_THREAD_STACK_SIZE=8192
CONFIG_INPUT_QUEUE_MAX_MSGS=512
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512

# zmk studio over the dongle's USB connection
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
